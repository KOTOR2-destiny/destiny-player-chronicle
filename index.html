<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Destiny Player Chronicle</title>
<style>html,body{margin:0;min-height:100%;background:#00070b;color:#d9fbff;font-family:Arial,Helvetica,sans-serif}.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;letter-spacing:2px;color:#8bd7e3}</style>
</head>
<body>
<div class="boot">LOADING DESTINY PLAYER CHRONICLE...</div>
<script>
(async function(){
  try{
    const response=await fetch('app.html?v=20260912-1939',{cache:'no-store'});
    if(!response.ok) throw new Error('Could not load Chronicle application: HTTP '+response.status);
    let html=await response.text();
    const marker='let characterSheetRecord=null;\nlet characterSheetSaveTimer=null;\nlet characterSheetHydrating=false;';
    const helper=`let characterSheetRecord=null;\nlet characterSheetSaveTimer=null;\nlet characterSheetHydrating=false;\n\nfunction escapeHtml(value){\n    return String(value ?? \"\")\n        .replace(/&/g,\"&amp;\")\n        .replace(/</g,\"&lt;\")\n        .replace(/>/g,\"&gt;\")\n        .replace(/\"/g,\"&quot;\")\n        .replace(/'/g,\"&#039;\");\n}`;
    if(!html.includes(marker)) throw new Error('Character Sheet patch marker was not found.');
    html=html.replace(marker,helper);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<div class="boot">CHRONICLE LOAD ERROR // '+String(error.message||error)+'</div>';
  }
})();
</script>
</body>
</html>
