name: Validate character exports and GM review
on:
  push:
    branches: [character-exports-gm-review, current-party-selection]
  pull_request:
    branches: [main]
    paths: ['character-export*.js', 'gm-party*', 'index.html', 'gm-admin.html', 'vendor/**', 'scripts/*character-exports*', 'scripts/build-export-calculator.cjs', 'app-v14.html', 'patch-v15.js', 'patch-forge-equipment-v159.js', 'package*.json', '.github/workflows/validate-character-exports.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:exports
        env:
          EXPORT_QA_DIR: character-export-qa
      - run: npm run test:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-export-verification
          path: |
            character-export-qa/
            advancement-*.png
            equipment-*.png
