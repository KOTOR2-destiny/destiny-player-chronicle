name: Validate double blade Forge
on:
  push:
    branches: [forge-double-blade]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright pngjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-forge-double.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-double-verification
          path: |
            double-verification.json
            double-runtime-*.png
            double-lit-*.png
