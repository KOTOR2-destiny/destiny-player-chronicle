name: Build Forge Component Assets

on:
  push:
    paths:
      - forge-prototype-atlas.webp
      - .github/workflows/build-forge-assets.yml

permissions:
  contents: write

jobs:
  split-forge-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Split, clean, and normalize component assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          from collections import deque

          atlas=Image.open('forge-prototype-atlas.webp').convert('RGBA')
          slots=['emitter','upper-hilt','grip','control','lower-hilt','pommel']
          families=['temple','guardian','ancient']
          cw,ch=atlas.width//6,atlas.height//3
          out=Path('forge-parts')
          out.mkdir(exist_ok=True)

          def largest_component(img):
              px=img.load(); w,h=img.size
              opaque={(x,y) for y in range(h) for x in range(w) if px[x,y][3] > 5}
              best=set()
              while opaque:
                  seed=opaque.pop(); comp={seed}; q=deque([seed])
                  while q:
                      x,y=q.popleft()
                      for nx in (x-1,x,x+1):
                          for ny in (y-1,y,y+1):
                              if (nx,ny) in opaque:
                                  opaque.remove((nx,ny)); comp.add((nx,ny)); q.append((nx,ny))
                  if len(comp)>len(best): best=comp
              clean=Image.new('RGBA',(w,h),(0,0,0,0)); cp=clean.load()
              for x,y in best: cp[x,y]=px[x,y]
              return clean

          for row,family in enumerate(families):
              folder=out/family; folder.mkdir(parents=True,exist_ok=True)
              for col,slot in enumerate(slots):
                  # Emitter claws and pommel rings can cross the original atlas cell boundary.
                  # Give those end pieces source-side breathing room, then let connected-component
                  # isolation reject neighboring artwork before normalizing back to the standard canvas.
                  pad_x=24 if slot in ('emitter','pommel') else 0
                  pad_y=18 if slot in ('emitter','pommel') else 0
                  left=max(0,col*cw-pad_x); top=max(0,row*ch-pad_y)
                  right=min(atlas.width,(col+1)*cw+pad_x); bottom=min(atlas.height,(row+1)*ch+pad_y)
                  cell=atlas.crop((left,top,right,bottom))
                  clean=largest_component(cell)
                  box=clean.getbbox()
                  if not box: raise RuntimeError(f'Empty component: {family}/{slot}')
                  piece=clean.crop(box)
                  # Keep a transparent safety margin so decorative claws/rings never touch the
                  # rendered image edge. Only end pieces are scaled if their recovered silhouette
                  # would otherwise exceed that protected area.
                  margin=8 if slot in ('emitter','pommel') else 0
                  maxw=cw-margin*2; maxh=ch-margin*2
                  if piece.width>maxw or piece.height>maxh:
                      scale=min(maxw/piece.width,maxh/piece.height)
                      piece=piece.resize((max(1,round(piece.width*scale)),max(1,round(piece.height*scale))),Image.Resampling.LANCZOS)
                  canvas=Image.new('RGBA',(cw,ch),(0,0,0,0))
                  x=(cw-piece.width)//2; y=(ch-piece.height)//2
                  canvas.alpha_composite(piece,(x,y))
                  canvas.save(folder/f'{slot}.png',optimize=True)
                  print(f'{family}/{slot}.png {piece.size} centered at {x},{y}')
          PY
      - name: Commit generated Forge assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-parts
          if git diff --cached --quiet; then
            echo "Forge assets already current."
          else
            git commit -m "Generate isolated Forge component assets"
            git push
          fi
