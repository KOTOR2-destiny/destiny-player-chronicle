name: Validate character advancement and Forge
on:
  push:
    branches: [character-advancement]
  pull_request:
    branches: [main]
    paths: ['advancement-engine-v1.js', 'patch-character-advancement-v160.js', 'data/saga-advancement-v1.json', 'scripts/verify-advancement*.cjs', '.github/workflows/validate-character-advancement.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-advancement-engine.cjs
      - run: npm install --no-save playwright pngjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-advancement-browser.cjs
      - run: node scripts/verify-forge-equipment.cjs
      - run: node scripts/verify-forge-full.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-advancement-verification
          path: |
            advancement-*.png
            advancement-*-verification.json
            equipment-*.png
            equipment-*-verification.json
