name: Validate approved Forge parts
on:
  push:
    branches: [forge-approved-nine-families]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-forge-parts.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-integration-verification
          path: |
            parts-integration-verification.json
            parts-runtime-*.png
