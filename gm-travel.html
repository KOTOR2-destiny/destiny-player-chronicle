<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destiny // GM Travel Log</title><style>body{background:#020c12;color:#d8f6fa;font:15px Arial,sans-serif;max-width:1050px;margin:25px auto;padding:15px}h1,h2{color:#9af1ff}a{color:#9af1ff}main{display:none}form,.entry{border:1px solid #286d7d;background:#061b26;padding:18px;margin:15px 0}label{display:block;margin:12px 0 4px;color:#a4ffe2}input,select,textarea,button{box-sizing:border-box;background:#03131c;color:#e5faff;border:1px solid #397b8a;padding:10px;font:inherit}input,select,textarea{width:100%}textarea{min-height:75px}button{cursor:pointer;margin:7px 5px 7px 0}button:disabled{opacity:.5}button.danger{border-color:#d47777;color:#ffb4b4}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid label{margin-top:0}.entry{line-height:1.6}.entry small{color:#9bbbc4}#message{min-height:24px;color:#a4ffe2}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><a href="gm-admin.html">← GALACTIC DATABASE ADMIN</a><h1>GM // CREW TRAVEL LOG</h1><p>Drafts are GM-only. A journey is visible to players only after you publish it. Enter only information the players already know in the public description.</p><p id="message">Checking GM access…</p><main id="main"><form id="journeyForm"><h2 id="formTitle">NEW JOURNEY</h2><div class="grid"><div><label for="origin">DEPARTURE WORLD</label><select id="origin" required></select></div><div><label for="destination">ARRIVAL WORLD</label><select id="destination" required></select></div><div><label for="departure">DEPARTURE DATE (BBY)</label><input id="departure" type="date" required></div><div><label for="arrival">ARRIVAL DATE (BBY)</label><input id="arrival" type="date" required></div></div><label for="transport">TRANSPORT (PLAYER-KNOWN ONLY)</label><input id="transport" maxlength="250"><label for="publicNote">PUBLIC DESCRIPTION (OPTIONAL; PLAYER-VISIBLE)</label><textarea id="publicNote" maxlength="2000"></textarea><label><input id="published" type="checkbox" style="width:auto"> PUBLISH TO PLAYER CHRONICLE</label><p><button type="submit" id="save">SAVE JOURNEY</button><button type="button" id="clear">NEW / CANCEL EDIT</button></p></form><h2>JOURNEYS</h2><div id="entries"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="gm-admin-config.js"></script><script src="gm-travel.js?v=20260917-2007"></script></body></html>
